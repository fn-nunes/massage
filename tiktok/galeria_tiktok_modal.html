<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Galeria TikTok</title>

<style>
body {
    font-family: Arial;
    background:#111;
    padding:20px;
    color:white;
}

h1 { text-align:center; }

.galeria {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:15px;
}

.video {
    overflow:hidden;
    border-radius:10px;
    transition:0.3s;
    text-align:center;
    cursor:pointer;
}

.video img {
    width:100%;
    display:block;
    border-radius:10px;
}

.numero {
    background: blue;
    color: white;
    padding: 5px 0;
    margin-top: 5px;
    font-weight: bold;
    border-radius: 0 0 10px 10px;
}

.video:hover {
    transform:scale(1.05);
}

.modal {
    font-size: 51px;
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.modal a, .modal h3 {
    width:50vw;
    max-width:600px;
}

.modal a {
    color:white;
    margin:5px;
    display:block;
}

.close {
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
}
</style>
</head>

<div id="modal" class="modal">
    <div class="close" onclick="closeModal()">X</div>

    <a id="videoLink" target="_blank">Abrir vídeo</a>

    <h3>Pesquisar:</h3>
author-name= <span id="authorName"></span><br>
author_id= <span id="authorId"></span><br>
    <a id="google" target="_blank">Google</a>
    <a id="bing" target="_blank">Bing</a>
    <a id="duck" target="_blank">DuckDuckGo</a>
    <a id="youtube" target="_blank">YouTube</a>
    <a id="tiktok" target="_blank">TikTok</a>

    <!-- ✅ INSTAGRAM AGORA EM DOIS LINKS -->
    <a id="instagram-a" target="_blank">Insta(Author)</a>
    <a id="instagram-b" target="_blank">Insta(Author ID)</a>
    <a id="face-a" target="_blank">face(Author)</a>
</div>

<script>

function sanitize(text){
    return encodeURIComponent(String(text || "").replace(/\s+/g,'').trim());
}

function openModal(url, query, author, author_id){
    document.getElementById('modal').style.display='flex';

    document.getElementById('videoLink').href=url;

    document.getElementById('google').href="https://google.com/search?q="+query;
    document.getElementById('bing').href="https://bing.com/search?q="+query;
    document.getElementById('duck').href="https://duckduckgo.com/?q="+query;
    document.getElementById('youtube').href="https://youtube.com/results?search_query="+query;
    document.getElementById('tiktok').href="tiktok://search?keyword="+query;

    let a = sanitize(author);
    let b = sanitize(author_id);

    // INSTAGRAM 1
    document.getElementById('instagram-a').href =
        "https://www.instagram.com/explore/tags/" + a + "/";
    // FACE 1
    document.getElementById('face-a').href =
        "https://www.facebook.com/watch/search/?q=" + a ;

    // INSTAGRAM 2
    document.getElementById('instagram-b').href =
        "https://www.instagram.com/explore/tags/" + b + "/";
document.getElementById('authorName').textContent = author;
document.getElementById('authorId').textContent = author_id;
}

function closeModal(){
    document.getElementById('modal').style.display='none';
}

document.getElementById('modal').onclick=function(e){
    if(e.target===this) closeModal();
};

</script>

</body>

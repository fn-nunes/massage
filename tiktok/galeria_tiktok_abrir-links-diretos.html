<script>
function salvarImagem(id, url) {
    fetch(url)
        .then(res => res.blob())
        .then(blob => {
            const tx = db.transaction("imagens", "readwrite");
            const store = tx.objectStore("imagens");

            store.put({
                id: id,
                file: blob
            });
        });
}
</script>
